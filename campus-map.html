<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maps</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
     integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
     crossorigin=""/>
    <!-- Make sure you put this AFTER Leaflet's CSS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
     integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
     crossorigin=""></script>
     <style>
        #map { 
            height: 1000px;
        }
        .popup-image{
            width: 300px;
            height: auto;
            object-fit:contain;
        }
     </style>
</head>
<body>
    <h1>Campus Map</h1>
    <div id="map"></div>
</body>
<script>

    function initMap(mapDataUr){
        const map = L.map('map').setView([8.3603,124.8684],17);

        const OpenStreetMap = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; OpenStreetMap contributors'
        });

        const satellite = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            attribution: 'Tiles (c) Ersi &mdash; Source: Esri, i-cubed, USDA, USGS, AEX, GeoEye, Getmapping, Aerogrid, IGN, IGP, UPR-EGP, and the GIS User Community'
        });

        OpenStreetMap.addTo(map);
        console.log("Map loaded"+ Date());

        const markerGroups ={};

        fetch (mapDataUrl)
            .then(reponse => response.json())
            .then(data => {
                data.forEach(pin => {
                    const type = pin.locationType || "Other";

                    if (!markerGroups[type]){
                        markerGroups[type] = L.layerGroup().addTo(map);
                    }

                    const marker = L.marker([pin.lat, pin.lng]).addTo(map);
                    const img = `<img src='${pin.img}' class ='popup-image'>`;
                        marker.bindPopup(`
                            ${img}<br>
                            <br>${pin.name}</br><br>
                            ${pin.description}
                    `);
                    console.log("Pin added: "+pin.name+ " "+ Date());

                    markerGroups[type].addLayer(marker);
                });

                Object.values(markerGroups).forEach(group => group.addTo(map));

                const baseMaps ={
                    "OpenStreetMap": openStreetMap,
                    "Satellite": satellite
                }

                const overlayMaps = {};

                Object.keys(markerGroups).forEach(type => {
                    overlayMaps[type] = markerGroups[type];
                });

                L.control.tileLayer(baseMaps, overlayMaps).addTo(map);
                    
            })
            .catch(error => console.error("Error loading map data:", error));
    }

    document.addEventListener("DOMContentLoaded", function(){
        initMap("campus-map.json");  
    });
</script>
</html>
