<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maps</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
     integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
     crossorigin=""/>
    <!-- Make sure you put this AFTER Leaflet's CSS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
     integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
     crossorigin=""></script>
     <style>
        #map { height: 500px;}
     </style>
</head>
<body>
    <h1>Map</h1>
    <div id="map"></div>
</body>
<script>
    var map = L.map('map').setView([8.359300128287973, 124.86907287191958], 13);
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '&copy; <a href="http://www.openstreetmap.org/copyright">OpenStreetMap</a>'
    }).addTo(map);

    var marker = L.marker([8.359300128287973, 124.86907287191958]).addTo(map);
    marker.bindPopup("<b>Labaratory 2</b><br>Ania ka").openPopup();

    function initMap(mapDatUrl){
        const map = L.map('map').setView([8.3500, 124.8500], 13);
        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; <a href="http://www.openstreetmap.org/copyright">OpenStreetMap</a>'
        }).addTo(map);
        console.log("Map loaded"+ Date());

        fetch (mapDatUrl)
            .then(response => response.json())
            .then(data => {
                data.forEach(pin => {
                    const marker = L.marker([pin.lat, pin.lng]).addTo(map);
                    marker.bindPopup(`<b>${location.name}</b><br>${location.description}`);
                });
            })
            .catch(error => console.error("Error loading map data:", error));
    }
</script>
</html>
